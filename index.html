<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>BENCH Chat</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --border:#2a2f3a;
    --text:#e8eaed; --muted:#8b93a1; --accent:#6c8cff; --accent-2:#4f6fe0;
    --user-bubble:#2b5cff; --bot-bubble:#20242d; --danger:#ff5d5d; --good:#3ecf8e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; height:100vh; height:100dvh;
  }
  header{
    padding:14px 18px; background:var(--panel); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-shrink:0;
  }
  header .title{display:flex; flex-direction:column; gap:2px;}
  header h1{font-size:16px; margin:0; font-weight:600;}
  header .sub{font-size:12px; color:var(--muted);}
  .status{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0;}
  .dot.loading{background:#f5c451; animation:pulse 1s infinite;}
  .dot.ready{background:var(--good);}
  .dot.error{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  #loadingBar{
    height:3px; background:var(--panel-2); flex-shrink:0; position:relative; overflow:hidden;
  }
  #loadingBar .fill{
    height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .25s ease;
  }

  main{flex:1; overflow:hidden; display:flex; flex-direction:column;}
  #log{
    flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px;
  }
  .msg{max-width:78%; padding:10px 14px; border-radius:14px; line-height:1.45; font-size:14.5px; white-space:pre-wrap; word-wrap:break-word;}
  .msg.user{align-self:flex-end; background:var(--user-bubble); color:#fff; border-bottom-right-radius:4px;}
  .msg.bot{align-self:flex-start; background:var(--bot-bubble); border-bottom-left-radius:4px;}
  .msg.system{align-self:center; background:transparent; color:var(--muted); font-size:12.5px; max-width:90%; text-align:center;}
  .msg.bot.typing .caret{display:inline-block; width:7px; height:14px; background:var(--muted); margin-left:2px; vertical-align:-2px; animation:blink 1s step-start infinite;}
  @keyframes blink{50%{opacity:0;}}

  footer{
    padding:12px 16px 16px; background:var(--panel); border-top:1px solid var(--border); flex-shrink:0;
  }
  .composer{display:flex; gap:10px; align-items:flex-end;}
  #input{
    flex:1; resize:none; max-height:120px; min-height:44px; padding:11px 14px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:12px;
    color:var(--text); font-size:14.5px; font-family:inherit; outline:none;
  }
  #input:focus{border-color:var(--accent);}
  #input:disabled{opacity:.5;}
  button{
    border:none; border-radius:12px; padding:11px 18px; font-size:14px; font-weight:600;
    cursor:pointer; transition:opacity .15s ease, transform .05s ease;
  }
  button:active{transform:scale(0.97);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  #sendBtn{background:var(--accent); color:#fff;}
  #sendBtn:hover:not(:disabled){background:var(--accent-2);}
  #stopBtn{background:var(--danger); color:#fff; display:none;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:10px; flex-wrap:wrap;}
  .settings{display:flex; gap:14px; align-items:center; font-size:12px; color:var(--muted); flex-wrap:wrap;}
  .settings label{display:flex; align-items:center; gap:5px;}
  .settings input[type=range]{width:80px; accent-color:var(--accent);}
  .settings input[type=checkbox]{accent-color:var(--accent);}
  .ghost{background:transparent; color:var(--muted); border:1px solid var(--border); padding:6px 12px; font-size:12px; font-weight:500;}
  .ghost:hover:not(:disabled){color:var(--text); border-color:var(--accent);}
  #errBanner{
    display:none; background:#3a1d1d; color:#ffb4b4; border:1px solid #5c2a2a;
    padding:10px 14px; font-size:13px; margin:0 16px 10px; border-radius:10px; white-space:pre-wrap;
  }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>BENCH Chat</h1>
    <div class="sub" id="subtitle">Local ONNX chat model — runs entirely in your browser</div>
  </div>
  <div class="status"><span class="dot loading" id="statusDot"></span><span id="statusText">Loading model…</span></div>
</header>
<div id="loadingBar"><div class="fill" id="loadingFill"></div></div>
<div id="errBanner"></div>

<main>
  <div id="log"></div>
</main>

<footer>
  <div class="toolbar">
    <div class="settings">
      <label><input type="checkbox" id="greedy"> Greedy</label>
      <label>Temp <input type="range" id="temp" min="0.1" max="1.5" step="0.05" value="0.8"><span id="tempVal">0.80</span></label>
      <label>Top-k <input type="range" id="topk" min="1" max="100" step="1" value="40"><span id="topkVal">40</span></label>
      <label>Max tokens <input type="range" id="maxtok" min="16" max="400" step="8" value="200"><span id="maxtokVal">200</span></label>
    </div>
    <button class="ghost" id="resetBtn">Reset chat</button>
  </div>
  <div class="composer">
    <textarea id="input" placeholder="Loading model…" rows="1" disabled></textarea>
    <button id="sendBtn" disabled>Send</button>
    <button id="stopBtn">Stop</button>
  </div>
</footer>

<script>
/* ---------------------------------------------------------------------
   BENCH Chat — standalone client for a small ONNX causal LM.
   Expects chat_config.json, chat_tokenizer.json, chat_agent.onnx to be
   served from the same directory as this file.
--------------------------------------------------------------------- */

const FILES = {
  config: 'chat_config.json',
  tokenizer: 'chat_tokenizer.json',
  model: 'https://pub-0ae64ca7878b4960b841fc6246a22b8d.r2.dev/chat_agent.onnx'
};

const el = (id) => document.getElementById(id);
const logEl = el('log'), inputEl = el('input'), sendBtn = el('sendBtn'), stopBtn = el('stopBtn');
const statusDot = el('statusDot'), statusText = el('statusText'), subtitle = el('subtitle');
const loadingFill = el('loadingFill'), loadingBar = el('loadingBar'), errBanner = el('errBanner');
const tempSlider = el('temp'), tempVal = el('tempVal');
const topkSlider = el('topk'), topkVal = el('topkVal');
const maxtokSlider = el('maxtok'), maxtokVal = el('maxtokVal');
const greedyBox = el('greedy'), resetBtn = el('resetBtn');

tempSlider.oninput = () => tempVal.textContent = parseFloat(tempSlider.value).toFixed(2);
topkSlider.oninput = () => topkVal.textContent = topkSlider.value;
maxtokSlider.oninput = () => maxtokVal.textContent = maxtokSlider.value;

let config = null;
let tokenizerData = null;
let session = null;
let ready = false;
let generating = false;
let stopRequested = false;

// conversation state: array of {role: 'user'|'assistant', text: string}
let history = [];

function setStatus(state, text) {
  statusDot.className = 'dot ' + state;
  statusText.textContent = text;
}

function showError(msg) {
  errBanner.style.display = 'block';
  errBanner.textContent = msg;
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div;
}

function addSystemNote(text) {
  addMessage('system', text);
}

/* ----------------------------- Tokenizer ----------------------------- */
/* Hand-rolled ByteLevel-BPE encoder/decoder compatible with a standard
   HuggingFace `tokenizers` BPE tokenizer.json (GPT-2 style). */

class ByteLevelBPETokenizer {
  constructor(tokenizerJson) {
    const model = tokenizerJson.model;
    if (model.type !== 'BPE') {
      throw new Error('Unsupported tokenizer model type: ' + model.type);
    }
    this.vocab = model.vocab;                 // token string -> id
    this.idToToken = {};
    for (const [tok, id] of Object.entries(this.vocab)) this.idToToken[id] = tok;

    this.merges = model.merges;                // array of [a, b]
    this.rank = new Map();
    this.merges.forEach((pair, i) => this.rank.set(pair[0] + '\u0001' + pair[1], i));

    this.addedTokens = {};                     // id -> content, for specials
    this.addedTokenToId = {};
    (tokenizerJson.added_tokens || []).forEach(t => {
      this.addedTokens[t.id] = t.content;
      this.addedTokenToId[t.content] = t.id;
    });

    this._buildByteMaps();
    this.pat = /'s|'t|'re|'ve|'m|'ll|'d| ?\p{L}+| ?\p{N}+| ?[^\s\p{L}\p{N}]+|\s+(?!\S)|\s+/gu;
    this.bpeCache = new Map();
  }

  _buildByteMaps() {
    // Standard GPT-2 byte<->unicode mapping
    let bs = [];
    for (let i = '!'.charCodeAt(0); i <= '~'.charCodeAt(0); i++) bs.push(i);
    for (let i = 0xA1; i <= 0xAC; i++) bs.push(i);
    for (let i = 0xAE; i <= 0xFF; i++) bs.push(i);
    let cs = bs.slice();
    let n = 0;
    for (let b = 0; b < 256; b++) {
      if (!bs.includes(b)) { bs.push(b); cs.push(256 + n); n++; }
    }
    this.byteEncoder = {}; // byte -> char
    this.byteDecoder = {}; // char -> byte
    for (let i = 0; i < bs.length; i++) {
      const ch = String.fromCharCode(cs[i]);
      this.byteEncoder[bs[i]] = ch;
      this.byteDecoder[ch] = bs[i];
    }
  }

  _bytesToUnicode(str) {
    const bytes = new TextEncoder().encode(str);
    let out = '';
    for (const b of bytes) out += this.byteEncoder[b];
    return out;
  }

  _bpe(token) {
    if (this.bpeCache.has(token)) return this.bpeCache.get(token);
    let word = Array.from(token);
    if (word.length <= 1) { this.bpeCache.set(token, word); return word; }

    while (true) {
      let minRank = Infinity, minIdx = -1;
      for (let i = 0; i < word.length - 1; i++) {
        const r = this.rank.get(word[i] + '\u0001' + word[i + 1]);
        if (r !== undefined && r < minRank) { minRank = r; minIdx = i; }
      }
      if (minIdx === -1) break;
      const merged = word[minIdx] + word[minIdx + 1];
      word = word.slice(0, minIdx).concat([merged], word.slice(minIdx + 2));
    }
    this.bpeCache.set(token, word);
    return word;
  }

  // Encode plain text (no special tokens) -> array of ids
  encode(text) {
    if (text === '') return [];
    const pieces = text.match(this.pat) || [];
    const ids = [];
    for (const piece of pieces) {
      const mapped = this._bytesToUnicode(piece);
      const subwords = this._bpe(mapped);
      for (const sw of subwords) {
        const id = this.vocab[sw];
        if (id === undefined) {
          // Should not happen with byte-level vocab coverage; skip defensively.
          continue;
        }
        ids.push(id);
      }
    }
    return ids;
  }

  specialId(name) {
    const id = this.addedTokenToId[name];
    if (id === undefined) throw new Error('Missing special token: ' + name);
    return id;
  }

  // Decode array of ids -> text, stopping/skipping special tokens.
  decode(ids) {
    let chars = '';
    for (const id of ids) {
      if (this.addedTokens.hasOwnProperty(id)) continue; // skip specials in output
      const tok = this.idToToken[id];
      if (tok === undefined) continue;
      chars += tok;
    }
    const bytes = new Uint8Array(chars.length);
    for (let i = 0; i < chars.length; i++) {
      const b = this.byteDecoder[chars[i]];
      bytes[i] = (b === undefined) ? 0x3f : b; // '?' fallback
    }
    try {
      return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
    } catch (e) {
      return '';
    }
  }
}

let tokenizer = null;

/* ------------------------------ Loading ------------------------------ */

async function fetchJson(path) {
  const res = await fetch(path, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Failed to fetch ${path} (HTTP ${res.status})`);
  return res.json();
}

async function loadEverything() {
  try {
    setStatus('loading', 'Loading config…');
    loadingFill.style.width = '10%';
    config = await fetchJson(FILES.config);

    setStatus('loading', 'Loading tokenizer…');
    loadingFill.style.width = '25%';
    tokenizerData = await fetchJson(FILES.tokenizer);
    tokenizer = new ByteLevelBPETokenizer(tokenizerData);

    setStatus('loading', 'Downloading model weights…');
    loadingFill.style.width = '40%';

    ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/';

    const modelRes = await fetch(FILES.model, { cache: 'no-store' });
    if (!modelRes.ok) throw new Error(`Failed to fetch ${FILES.model} (HTTP ${modelRes.status})`);
    const total = parseInt(modelRes.headers.get('content-length') || '0', 10);
    const reader = modelRes.body ? modelRes.body.getReader() : null;
    let modelBuffer;

    if (reader && total) {
      let received = 0;
      const chunks = [];
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        const pct = 40 + Math.round((received / total) * 45);
        loadingFill.style.width = Math.min(pct, 85) + '%';
        setStatus('loading', `Downloading model… ${(received / 1e6).toFixed(1)}MB / ${(total / 1e6).toFixed(1)}MB`);
      }
      modelBuffer = new Uint8Array(received);
      let offset = 0;
      for (const c of chunks) { modelBuffer.set(c, offset); offset += c.length; }
    } else {
      modelBuffer = new Uint8Array(await modelRes.arrayBuffer());
      loadingFill.style.width = '85%';
    }

    setStatus('loading', 'Initializing inference session…');
    session = await ort.InferenceSession.create(modelBuffer.buffer, {
      executionProviders: ['wasm']
    });
    loadingFill.style.width = '100%';

    validateModelIO();

    setStatus('ready', 'Ready');
    subtitle.textContent = (config.notes || 'Local ONNX chat model') + ' — runs entirely in your browser';
    inputEl.disabled = false;
    inputEl.placeholder = 'Message the assistant…';
    sendBtn.disabled = false;
    ready = true;

    setTimeout(() => { loadingBar.style.display = 'none'; }, 500);
    addSystemNote('Model loaded. Conversation starts fresh — nothing is sent to a server.');
    inputEl.focus();
  } catch (err) {
    console.error(err);
    setStatus('error', 'Failed to load');
    showError(
      'Could not load the chat model.\n' +
      (err && err.message ? err.message : err) +
      '\n\nMake sure chat_config.json and chat_tokenizer.json are served alongside ' +
      'this page, and that the model URL is reachable with CORS enabled ' +
      '(opening this file directly with file:// will not work — serve it over http/https).'
    );
  }
}

function validateModelIO() {
  const inNames = session.inputNames || [];
  const outNames = session.outputNames || [];
  if (!inNames.includes(config.input_name)) {
    throw new Error(`Model input "${config.input_name}" not found. Model exposes: ${inNames.join(', ')}`);
  }
  if (!outNames.includes(config.output_name)) {
    throw new Error(`Model output "${config.output_name}" not found. Model exposes: ${outNames.join(', ')}`);
  }
}

/* ---------------------------- Prompt build ---------------------------- */

function buildPromptIds() {
  const sys = tokenizer.specialId('<|system|>');
  const usr = tokenizer.specialId('<|user|>');
  const asst = tokenizer.specialId('<|assistant|>');
  const eos = config.eos_token_id;

  const systemIds = tokenizer.encode(config.system_prompt || '');
  let prefix = [sys, ...systemIds];

  // Encode each turn; assistant turns end with eos to mark completion.
  const turns = [];
  for (const t of history) {
    if (t.role === 'user') {
      turns.push([usr, ...tokenizer.encode(t.text)]);
    } else {
      turns.push([asst, ...tokenizer.encode(t.text), eos]);
    }
  }

  // Fit within context, keeping system prompt and most recent turns.
  const reserve = 8; // headroom for the trailing <|assistant|> + generation start
  let budget = config.context_length - prefix.length - reserve;
  let kept = [];
  for (let i = turns.length - 1; i >= 0; i--) {
    if (turns[i].length <= budget) {
      kept.unshift(turns[i]);
      budget -= turns[i].length;
    } else {
      break;
    }
  }

  let ids = prefix.concat(...kept, [asst]);
  return ids;
}

/* ------------------------------ Sampling ------------------------------ */

function softmax(logits) {
  let max = -Infinity;
  for (const v of logits) if (v > max) max = v;
  let sum = 0;
  const out = new Float32Array(logits.length);
  for (let i = 0; i < logits.length; i++) {
    const e = Math.exp(logits[i] - max);
    out[i] = e;
    sum += e;
  }
  for (let i = 0; i < out.length; i++) out[i] /= sum;
  return out;
}

function sampleNextId(logitsRow, opts) {
  const { greedy, temperature, topK } = opts;

  if (greedy) {
    let best = -Infinity, bestIdx = 0;
    for (let i = 0; i < logitsRow.length; i++) {
      if (logitsRow[i] > best) { best = logitsRow[i]; bestIdx = i; }
    }
    return bestIdx;
  }

  const scaled = new Float32Array(logitsRow.length);
  const t = Math.max(temperature, 0.05);
  for (let i = 0; i < logitsRow.length; i++) scaled[i] = logitsRow[i] / t;

  // top-k filter
  const k = Math.max(1, Math.min(topK, scaled.length));
  const indices = Array.from(scaled.keys());
  indices.sort((a, b) => scaled[b] - scaled[a]);
  const topIndices = indices.slice(0, k);
  const topLogits = topIndices.map(i => scaled[i]);
  const probs = softmax(topLogits);

  let r = Math.random();
  let acc = 0;
  for (let i = 0; i < probs.length; i++) {
    acc += probs[i];
    if (r <= acc) return topIndices[i];
  }
  return topIndices[topIndices.length - 1];
}

/* ------------------------------ Generation ----------------------------- */

async function generateReply() {
  const eos = config.eos_token_id;
  const maxNew = parseInt(maxtokSlider.value, 10);
  const greedy = greedyBox.checked;
  const temperature = parseFloat(tempSlider.value);
  const topK = parseInt(topkSlider.value, 10);

  let ids = buildPromptIds();
  const generated = [];

  const botDiv = addMessage('bot', '');
  botDiv.classList.add('typing');
  const caret = document.createElement('span');
  caret.className = 'caret';
  botDiv.appendChild(caret);

  const dtype = config.dtype || 'int64';

  for (let step = 0; step < maxNew; step++) {
    if (stopRequested) break;

    if (ids.length >= config.context_length) {
      // Drop oldest tokens after the system block to stay in-window.
      const overflow = ids.length - config.context_length + 1;
      ids = ids.slice(overflow);
    }

    const seqLen = ids.length;
    let inputTensor;
    if (dtype === 'int64') {
      inputTensor = new ort.Tensor('int64', BigInt64Array.from(ids.map(BigInt)), [1, seqLen]);
    } else {
      inputTensor = new ort.Tensor('int32', Int32Array.from(ids), [1, seqLen]);
    }

    const feeds = {};
    feeds[config.input_name] = inputTensor;

    let results;
    try {
      results = await session.run(feeds);
    } catch (err) {
      console.error(err);
      showError('Inference error: ' + (err && err.message ? err.message : err));
      break;
    }

    const logits = results[config.output_name];
    const vocabSize = logits.dims[logits.dims.length - 1];
    const lastRowStart = (seqLen - 1) * vocabSize;
    const lastRow = logits.data.slice(lastRowStart, lastRowStart + vocabSize);

    const nextId = sampleNextId(lastRow, { greedy, temperature, topK });

    // Stop at end-of-turn, or if the model starts a new turn on its own
    // (small models sometimes emit <|user|>/<|assistant|> instead of eos).
    if (nextId === eos || tokenizer.addedTokens.hasOwnProperty(nextId)) break;

    generated.push(nextId);
    ids.push(nextId);

    const text = tokenizer.decode(generated);
    botDiv.textContent = text;
    botDiv.appendChild(caret);
    logEl.scrollTop = logEl.scrollHeight;

    // Yield to the UI thread so it stays responsive.
    await new Promise(r => setTimeout(r, 0));
  }

  botDiv.classList.remove('typing');
  const finalText = tokenizer.decode(generated).trim();
  botDiv.textContent = finalText || '(no output)';
  history.push({ role: 'assistant', text: finalText });
  logEl.scrollTop = logEl.scrollHeight;
}

/* -------------------------------- Events -------------------------------- */

async function handleSend() {
  const text = inputEl.value.trim();
  if (!text || !ready || generating) return;

  history.push({ role: 'user', text });
  addMessage('user', text);
  inputEl.value = '';
  autoGrow();

  generating = true;
  stopRequested = false;
  sendBtn.disabled = true;
  inputEl.disabled = true;
  stopBtn.style.display = 'inline-block';

  try {
    await generateReply();
  } finally {
    generating = false;
    sendBtn.disabled = false;
    inputEl.disabled = false;
    stopBtn.style.display = 'none';
    inputEl.focus();
  }
}

function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}

inputEl.addEventListener('input', autoGrow);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});
sendBtn.addEventListener('click', handleSend);
stopBtn.addEventListener('click', () => { stopRequested = true; });
resetBtn.addEventListener('click', () => {
  history = [];
  logEl.innerHTML = '';
  addSystemNote('Conversation reset.');
});

loadEverything();
</script>
</body>
</html>
